name: Android TV APK validation

on:
  push:
    branches: [android-tv-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Flutter tests
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - name: Build Android TV native core
        run: python3 scripts/build_native.py --platform android --abi armeabi-v7a --all-sources
      - name: Build installable test APK
        run: flutter build apk --debug --target-platform android-arm --dart-define=ALL_SOURCES=true
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-android-tv-armeabi-v7a-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
